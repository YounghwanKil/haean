[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "haean-typeset"
version = "2.1.0"
description = "Local HWPX layout engine with explicitly supplied templates"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
haean-typeset = "haean_typeset.core.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["haean_typeset*"]
exclude = ["*.tests", "*.tests.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

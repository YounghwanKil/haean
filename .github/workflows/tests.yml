name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install harness and HWPX test dependencies
        run: python -m pip install -e '.[dev,layout]' -e ./typeset
      - run: sudo apt-get update && sudo apt-get install -y graphviz fonts-nanum
      - run: pytest -q
